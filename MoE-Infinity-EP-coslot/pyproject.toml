[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-infinity-ep"
version = "0.0.1"
description = "Multi-process EP+DP rewrite of MoE-Infinity with pluggable cache policies"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "nvtx",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_infinity_ep*"]
