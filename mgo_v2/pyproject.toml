[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgo-v2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mgo_v2*"]
